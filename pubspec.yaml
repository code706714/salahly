name: salahly
description: Salahly (صلحلي) — find and book trusted tradesmen.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  connectivity_plus: ^7.3.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_native_contact_picker: ^0.0.12
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: any
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/legal/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
